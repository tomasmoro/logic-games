# Publica `legal-site/` en GitHub Pages.
#
# ¿POR QUÉ UN WORKFLOW Y NO "Deploy from a branch"? Pages, al desplegar desde una rama,
# solo admite como raíz del sitio `/` o `/docs`. El sitio legal vive en `legal-site/`, y
# `docs/` ya está ocupado por documentación interna del proyecto que no queremos servir
# como web. Con Actions se elige el directorio exacto, así que el sitio se queda donde
# está y no hay que duplicarlo en otro repo (que habría que mantener sincronizado a mano).
#
# REQUISITO: en el repo, Settings → Pages → Source: **GitHub Actions**.
name: Deploy legal site

on:
  push:
    branches: [main]
    # Solo se redespliega si cambian las páginas legales: un commit de código Kotlin no
    # tiene por qué disparar un deploy.
    paths:
      - 'legal-site/**'
      - '.github/workflows/deploy-legal-site.yml'
  # Permite lanzarlo a mano desde la pestaña Actions (útil para el primer despliegue).
  workflow_dispatch:

# Permisos mínimos que exige el despliegue oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se encadenan varios pushes, deja terminar el que esté en curso y descarta los
# intermedios: solo importa publicar el último estado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Se sube SOLO `legal-site/`: el resto del repo (código, docs internas) no se publica.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal-site

      - id: deployment
        uses: actions/deploy-pages@v4
